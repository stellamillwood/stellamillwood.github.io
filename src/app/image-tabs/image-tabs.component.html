<mat-tab-group>
    @for (tab of tabs; track tab.src) {
      <mat-tab [label]="tab.label">
        <div class="tab-content">
          <img [src]="tab.src" class="img-border img-small" alt="{{ tab.label }}" [attr.width]="tab.width" [attr.height]="tab.height" loading="lazy" />
          <p class="caption">{{ tab.caption }}</p>
        </div>
      </mat-tab>
    }
  </mat-tab-group>
